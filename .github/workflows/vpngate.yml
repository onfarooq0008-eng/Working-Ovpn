name: Update VPN Gate servers

on:
  schedule:
    - cron: "0 * * * *"   # every hour (GitHub may delay a few minutes)
  workflow_dispatch:          # manual run button

permissions:
  contents: write

concurrency:
  group: vpngate
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenVPN
        run: sudo apt-get update && sudo apt-get install -y openvpn

      - name: Fetch, test and pick fastest servers
        run: python3 scripts/vpngate.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update VPN servers $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
